[workspace]
channels = ["conda-forge"]
name = "big_data"
platforms = ["win-64", "osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
setup-nbstripout = "nbstripout --install"
check-nbstripout = "nbstripout --status"
strip-all = "nbstripout *.ipynb"

[dependencies]
pandas = ">=3.1.0,<4"
numpy = ">=2.5.4,<3"
matplotlib = ">=3.11.2,<4"
bs4 = ">=4.15.0,<5"
request = ">=2.83.1,<3"
seaborn = ">=0.13.2,<0.14"
pixi-kernel = ">=0.7.1,<0.8"
jupyterlab = ">=4.6.4,<5"
pixi-pycharm = ">=0.0.12,<0.0.13"
nbstripout = ">=0.9.1,<0.10"
